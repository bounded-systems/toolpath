[package]
name = "toolpath-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/empathic/toolpath"
description = "Desktop app for selecting, previewing, and exporting Toolpath traces"
keywords = ["toolpath", "desktop", "tauri", "provenance", "pathbase"]
categories = ["gui", "development-tools"]

[[bin]]
name = "toolpath-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toolpath = { workspace = true }
toolpath-claude = { workspace = true, features = ["watcher"] }
toolpath-codex = { workspace = true }
toolpath-gemini = { workspace = true }
toolpath-git = { workspace = true }
toolpath-github = { workspace = true }
toolpath-opencode = { workspace = true }
toolpath-pi = { workspace = true }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
git2 = { workspace = true }
keyring = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
